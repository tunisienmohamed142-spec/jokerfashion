<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produkt | JokerFashion</title>
    <meta
      name="description"
      content="Fullständig produktsida med storlekar, detaljer och snabbt köpflöde hos JokerFashion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app/styles/app.css" />
  </head>
  <body data-page="product">
    <header class="site-header">
      <div class="container nav-row">
        <a class="brand" href="index.html">Joker<span>Fashion</span></a>
      </div>
    </header>

    <main>
      <div class="container">
        <nav class="breadcrumb" aria-label="Brödsmulor" data-product-breadcrumb>
          <a href="index.html">Hem</a>
          <span class="breadcrumb-sep" aria-hidden="true">/</span>
          <a href="catalog.html" data-product-category-link>Katalog</a>
          <span class="breadcrumb-sep" aria-hidden="true">/</span>
          <span data-product-breadcrumb-name>Produkt</span>
        </nav>

        <section class="page-section">
          <div data-product-detail></div>
        </section>

        <section class="page-section" data-product-related-section style="display:none">
          <div class="section-header">
            <div>
              <p class="eyebrow">Fler från samma kollektion</p>
              <h2>Relaterade produkter</h2>
            </div>
            <a class="button secondary" href="catalog.html" data-product-catalog-link>Se hela kategorin</a>
          </div>
          <div class="related-grid" data-product-related></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>JokerFashion &bull; Fri frakt över 999 kr &bull; 14 dagars öppet köp &bull; Leverans 2–4 dagar</p>
      </div>
    </footer>

    <div class="cart-toast is-hidden" role="alert" aria-live="polite" data-cart-toast>
      <div class="cart-toast-copy">
        <p data-cart-toast-text>Produkten lades till i varukorgen.</p>
        <a href="checkout.html">Gå till varukorg →</a>
      </div>
      <button class="cart-toast-close" type="button" data-cart-toast-close aria-label="Stäng">✕</button>
    </div>

    <script type="module" src="app/main.js"></script>
  </body>
</html>
