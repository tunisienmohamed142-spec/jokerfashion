<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog | JokerFashion</title>
    <meta name="description" content="JokerFashion katalog — utforska kollektioner per kategori, se produktdetaljer och lägg till i varukorgen." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app/styles/app.css" />
  </head>
  <body data-page="catalog">
    <header class="site-header">
      <div class="container nav-row">
        <a class="brand" href="index.html">Joker<span>Fashion</span></a>
        <nav class="main-nav" aria-label="Huvudnavigation">
          <a class="nav-link" href="index.html">Hem</a>
          <a class="nav-link active" href="catalog.html">Katalog</a>
          <a class="nav-link" href="checkout.html">Varukorg <span class="cart-count" data-cart-count>0</span></a>
          <a class="nav-link" href="account.html">Konto</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">

        <!-- Page hero -->
        <section class="hero">
          <p class="eyebrow">Curated catalog</p>
          <h1 data-catalog-heading>Katalog</h1>
          <p data-catalog-intro class="hero-lead">Utforska produkter per kategori och bygg din look med snabbköp eller detaljvy.</p>
        </section>

        <!-- Category navigation -->
        <section class="page-section">
          <div class="pill-row" data-catalog-categories></div>
        </section>

        <!-- Toolbar -->
        <section class="page-section">
          <div class="catalog-toolbar">
            <p class="small-note" data-catalog-product-count></p>
            <a class="button secondary" href="checkout.html">Gå till varukorg</a>
          </div>
        </section>

        <!-- Spotlight + cart summary -->
        <section class="page-section grid-2">
          <article class="spotlight-card" data-catalog-spotlight></article>
          <aside class="panel" data-catalog-cart-summary></aside>
        </section>

        <!-- Product grid -->
        <section class="page-section">
          <p class="notice" data-catalog-feedback></p>
          <div class="product-grid" data-catalog-grid></div>
        </section>

      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom">
          <p class="footer-copy">&copy; 2026 JokerFashion Atelier</p>
          <a class="footer-copy" href="index.html">← Tillbaka till start</a>
        </div>
      </div>
    </footer>

    <script type="module" src="app/main.js"></script>
  </body>
</html>
