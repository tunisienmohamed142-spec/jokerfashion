<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog | JokerFashion</title>
    <meta name="description" content="Kategoribaserad produktkatalog med produktdetaljer och varukorg för JokerFashion." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app/styles/app.css" />
  </head>
  <body data-page="catalog">
    <header class="site-header">
      <div class="container nav-row">
        <a class="brand" href="index.html">Joker<span>Fashion</span></a>
      </div>
    </header>

    <main>
      <div class="container">
        <section class="hero">
          <p class="eyebrow">Target-group navigation</p>
          <h1 data-catalog-heading>Kvinna</h1>
          <p data-catalog-intro>Utforska produkter per målgrupp, kategori och underkategori.</p>
          <p class="small-note" data-catalog-trail></p>
        </section>

        <section class="page-section catalog-nav-stack">
          <div class="pill-row pill-row--level-1" data-catalog-target-groups></div>
          <div class="pill-row pill-row--level-2" data-catalog-main-categories></div>
          <div class="pill-row pill-row--level-3" data-catalog-subcategories></div>
        </section>

        <section class="page-section">
          <div class="catalog-toolbar">
            <p class="small-note" data-catalog-product-count></p>
            <div style="display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;">
              <select class="sort-select" data-catalog-sort aria-label="Sortera produkter">
                <option value="default">Standardordning</option>
                <option value="price-asc">Pris: lägst först</option>
                <option value="price-desc">Pris: högst först</option>
                <option value="name-asc">Namn A–Ö</option>
                <option value="new">Nyheter först</option>
              </select>
              <a class="button secondary" href="checkout.html">Gå till varukorg</a>
            </div>
          </div>
        </section>

        <section class="page-section grid-2">
          <article class="spotlight-card" data-catalog-spotlight></article>
          <aside class="panel" data-catalog-cart-summary></aside>
        </section>

        <section class="page-section">
          <p class="notice" data-catalog-feedback></p>
          <div class="product-grid" data-catalog-grid></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>JokerFashion &bull; Fri frakt över 999 kr &bull; 14 dagars öppet köp &bull; Leverans 2–4 dagar</p>
      </div>
    </footer>

    <div class="cart-toast is-hidden" role="alert" aria-live="polite" data-cart-toast>
      <div class="cart-toast-copy">
        <p data-cart-toast-text>Produkten lades till i varukorgen.</p>
        <a href="checkout.html">Gå till varukorg →</a>
      </div>
      <button class="cart-toast-close" type="button" data-cart-toast-close aria-label="Stäng">✕</button>
    </div>

    <script type="module" src="app/main.js"></script>
  </body>
</html>
